<text x="280.00" y="160.00" font-size="2.60" text-anchor="end" fill="#3d3d3d" font-style="italic">makali mbele, ncha nyuma · Schneide vorn, Spitze hinten</text>
<text x="12.00" y="178.00" font-size="2.90" text-anchor="start" fill="#1a1a1a">The blade lies flat on the blade cheek W5, its back edge against two pins. The clamp plate W3 presses it with two countersunk M6 bolts and wing nuts. Set the</text>
<text x="12.00" y="181.50" font-size="2.90" text-anchor="start" fill="#1a1a1a">blade so that it goes 1.5 mm into the strip O. Cut line = blade = 12.6 mm behind the rail. All cheeks float 2 mm above the cardboard.</text>
<text x="12.00" y="185.00" font-size="2.90" text-anchor="start" fill="#3d3d3d" font-style="italic">Kiwembe kinalala kwenye ubavu W5, mgongo wake ukigusa misumari miwili. Bamba W3 linakibana kwa bolti mbili M6 za kichwa bapa na nati za mabawa. Kiwembe kiingie</text>
<text x="12.00" y="188.50" font-size="2.90" text-anchor="start" fill="#3d3d3d" font-style="italic">mm 1.5 ndani ya O. Mstari wa kukata uko mm 12.6 nyuma ya reli.</text>
<text x="12.00" y="192.00" font-size="2.90" text-anchor="start" fill="#6b4a2b">Die Klinge liegt flach an der Klingenwange W5, der Rücken an zwei Stiften. Die Klemmplatte W3 drückt sie mit zwei Senkschrauben M6 und Flügelmuttern an. Klinge</text>
<text x="12.00" y="195.50" font-size="2.90" text-anchor="start" fill="#6b4a2b">so einstellen, dass sie 1.5 mm in die Opferleiste O taucht. Schnittlinie = Klinge = 12.6 mm hinter der Schiene. Alle Wangen schweben 2 mm über dem Karton.</text>
</svg>
